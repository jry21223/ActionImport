<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">ActionImport</title>
  <desc id="heroDesc">ActionImport 是一个 macOS 菜单栏工具：相机接上 Mac 之后，新增视频复制进本地目录，逐个计算 SHA-256 并读回核验，通过才算收好。图下方三步依次是相机存储、校验复制和按拍摄日期归档；右侧是项目配图里的火柴小人和暖黄色边牧。</desc>

  <defs>
    <pattern id="heroGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d8d1c3" stroke-width="1" opacity="0.42"/>
    </pattern>
    <pattern id="heroDots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.7" fill="#151515"/>
    </pattern>
    <clipPath id="heroClip"><rect width="1200" height="500" rx="28"/></clipPath>
    <clipPath id="dogBodyClip">
      <path d="M948 344C930 344 922 318 928 284C936 240 968 208 1010 206C1054 204 1084 228 1088 268C1092 310 1076 344 1044 344Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="500" fill="#f7f3ea"/>
    <rect width="1200" height="500" fill="url(#heroGrid)"/>
    <circle cx="1046" cy="176" r="212" fill="#f2c14e" opacity="0.30"/>
    <path d="M700 78C786 26 949 24 1130 68" fill="none" stroke="#151515" stroke-width="2" stroke-dasharray="3 10" opacity="0.26"/>
    <path d="M360 508C470 452 742 452 900 500" fill="none" stroke="#151515" stroke-width="2" stroke-dasharray="3 10" opacity="0.18"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
      <!-- 应用标记：路径直接取自菜单栏图标 menuIcon() -->
      <rect x="64" y="30" width="52" height="52" rx="14" fill="#232423" stroke="#151515" stroke-width="2"/>
      <g transform="translate(77.4 50.125) scale(0.9)" fill="none" stroke="#f8f4ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 5.5L4 5.5L5 4L7 4L8 5.5L9 5.5C9.83 5.5 10.5 6.17 10.5 7L10.5 11.5C10.5 12.33 9.83 13 9 13L2.5 13C1.67 13 1 12.33 1 11.5L1 7C1 6.17 1.67 5.5 2.5 5.5Z"/>
        <circle cx="5.75" cy="9.25" r="1.75"/>
      </g>

      <text x="132" y="64" fill="#6b675e" font-size="21" font-weight="600" letter-spacing="0.5">macOS 菜单栏工具 · 原生 AppKit · Swift 6 · 无第三方运行时</text>

      <text x="64" y="182" fill="#151515" font-size="84" font-weight="800" letter-spacing="-3.5">ActionImport</text>
      <text x="66" y="232" fill="#3a3833" font-size="27" font-weight="600">相机接上 Mac，新增视频复制进本地目录，</text>
      <text x="66" y="268" fill="#3a3833" font-size="27" font-weight="600">逐个计算 SHA-256 再读回核验，通过才记为完成。</text>
    </g>

    <!-- 角色：火柴小人与暖黄色边牧，服务于「收好」这件事 -->
    <g>
      <g stroke="#151515" stroke-width="4" stroke-linecap="round" fill="none">
        <circle cx="870" cy="132" r="34" fill="#fffdf7"/>
        <path d="M870 166L870 256"/>
        <path d="M870 190L816 228M870 190L934 214"/>
        <path d="M870 256L838 322M870 256L904 322"/>
        <circle cx="860" cy="130" r="12.5" stroke-width="3" fill="#f7f3ea"/>
        <circle cx="884" cy="130" r="12.5" stroke-width="3" fill="#f7f3ea"/>
        <path d="M872.5 130L871.5 130M847.5 130L836 130M896.5 130L904 130" stroke-width="2.4"/>
        <path d="M858 150Q870 159 882 150" stroke-width="3"/>
      </g>
      <circle cx="860" cy="130" r="3" fill="#151515"/>
      <circle cx="884" cy="130" r="3" fill="#151515"/>

      <path d="M1082 286C1108 276 1120 246 1106 218C1096 238 1084 258 1068 272Z" fill="#f2c14e" stroke="#151515" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M948 344C930 344 922 318 928 284C936 240 968 208 1010 206C1054 204 1084 228 1088 268C1092 310 1076 344 1044 344Z" fill="#f2c14e" stroke="#151515" stroke-width="4"/>
      <rect x="920" y="200" width="180" height="152" fill="url(#heroDots)" opacity="0.20" clip-path="url(#dogBodyClip)"/>
      <ellipse cx="1012" cy="272" rx="25" ry="34" fill="#fffdf7" stroke="#151515" stroke-width="3"/>
      <path d="M978 302Q978 348 992 348Q1006 348 1006 302Z" fill="#fffdf7" stroke="#151515" stroke-width="3.2"/>
      <path d="M1020 302Q1020 348 1034 348Q1048 348 1048 302Z" fill="#fffdf7" stroke="#151515" stroke-width="3.2"/>

      <circle cx="1012" cy="192" r="38" fill="#f2c14e" stroke="#151515" stroke-width="4"/>
      <path d="M988 172C970 166 954 182 954 204C954 218 966 228 978 222C990 212 994 186 988 172Z" fill="#f2c14e" stroke="#151515" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M1036 172C1054 166 1070 182 1070 204C1070 218 1058 228 1046 222C1034 212 1030 186 1036 172Z" fill="#f2c14e" stroke="#151515" stroke-width="3.4" stroke-linejoin="round"/>
      <ellipse cx="1012" cy="212" rx="21" ry="15" fill="#fffdf7" stroke="#151515" stroke-width="3"/>
      <circle cx="998" cy="186" r="5" fill="#151515"/>
      <circle cx="1028" cy="186" r="5" fill="#151515"/>
      <path d="M1012 202L1005 209L1019 209Z" fill="#151515"/>
      <path d="M1012 209V218M1012 218Q1006 224 1000 218M1012 218Q1018 224 1024 218" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round"/>

      <path d="M746 96L757 118L780 122L761 138L766 162L746 150L726 162L731 138L712 122L735 118Z" fill="#f2c14e" stroke="#151515" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M1114 356L1121 371L1136 374L1124 384L1127 399L1114 391L1101 399L1104 384L1092 374L1107 371Z" fill="#f2c14e" stroke="#151515" stroke-width="2.4" stroke-linejoin="round"/>
    </g>

    <!-- 下方的三步序列 -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
      <path d="M84 400H1116" fill="none" stroke="#151515" stroke-width="3" stroke-linecap="round"/>
      <path d="M330 392L348 400L330 408M640 392L658 400L640 408" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(160.1 323.8) scale(5.2)" fill="none" stroke="#151515" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 5.5L4 5.5L5 4L7 4L8 5.5L9 5.5C9.83 5.5 10.5 6.17 10.5 7L10.5 11.5C10.5 12.33 9.83 13 9 13L2.5 13C1.67 13 1 12.33 1 11.5L1 7C1 6.17 1.67 5.5 2.5 5.5Z"/>
        <circle cx="5.75" cy="9.25" r="1.75"/>
      </g>

      <g transform="translate(469.84 321.72) scale(5.2)" fill="none" stroke="#151515" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.2 4.6H8.2L10.4 6.8V13.4H1.2Z"/>
        <path d="M8.2 4.6V6.8H10.4"/>
        <path d="M3.4 9.3L4.9 10.8L7.9 7.3" stroke="#ff6a1e"/>
      </g>

      <g transform="translate(691.7 321.2) scale(5.2)" fill="none" stroke="#151515" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.5 6.5L18.5 4.5L21.7 4.5L23.3 6.5L27 6.5L27 13.5L18.5 13.5Z"/>
      </g>

      <circle cx="190" cy="400" r="7" fill="#151515"/>
      <circle cx="500" cy="400" r="7" fill="#151515"/>
      <circle cx="810" cy="400" r="7" fill="#151515"/>

      <text x="190" y="438" fill="#151515" font-size="25" font-weight="700" text-anchor="middle">相机存储</text>
      <text x="500" y="438" fill="#151515" font-size="25" font-weight="700" text-anchor="middle">校验复制</text>
      <text x="810" y="438" fill="#151515" font-size="25" font-weight="700" text-anchor="middle">按日期归档</text>

      <text x="190" y="468" fill="#6b675e" font-size="19" text-anchor="middle">DCIM 里的 MP4 · 只读</text>
      <text x="500" y="468" fill="#6b675e" font-size="19" text-anchor="middle">复制时算哈希，读回再算一次</text>
      <text x="810" y="468" fill="#6b675e" font-size="19" text-anchor="middle">2026-10-03 · 保留原文件名</text>
    </g>
  </g>
</svg>
